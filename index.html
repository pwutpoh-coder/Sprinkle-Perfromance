<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sprinkle Performance</title>

  <!-- ใส่ลิงก์รูปไอคอนโลโก้ของคุณตรงนี้ (URL รูปภาพที่เป็น .png หรือ .jpg) -->
  <link rel="icon" type="image/png" href="https://images.icon-icons.com/197/PNG/128/truck_23929.png">
  <link rel="apple-touch-icon" href="https://images.icon-icons.com/197/PNG/128/truck_23929.png">

  <!-- ตั้งค่าสีแถบสถานะเมื่อบันทึกลงหน้าจอโฮม -->
  <meta name="theme-color" content="#1e3a8a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sprinkle">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
    }
  </style>
</head>
<body>

  <!-- นำ URL ของ Web App จาก Apps Script มาวางในช่อง src ด้านล่างนี้ -->
  <iframe src="https://script.google.com/macros/s/AKfycbyPhbgkEq2LQmIm8FnpWGGHx4q66lo9fg3MI-j9K7wnQb7_VmWyYQuQkqDgbX1z1qWz/exec" allow="geolocation; microphone; camera"></iframe>

</body>
</html>
